name: PSLocalBase CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  test-windows:
    name: Test Windows (PS 7 & PS 5.1)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate Module Manifest
        shell: pwsh
        run: |
          Test-ModuleManifest -Path ./PSLocalBase.psd1 -ErrorAction Stop | Format-List Name, Version, PowerShellVersion

      - name: Static Analysis (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -RequiredVersion 1.25.0
          $findings = foreach ($file in 'PSLocalBase.psm1', 'InitWinSqlite3Native.ps1', 'PSLocalBase.psd1') {
            Invoke-ScriptAnalyzer -Path "./$file" -Severity Error, Warning | Where-Object Severity -ne 'Information'
          }
          $findings | Format-Table ScriptName, Line, Severity, RuleName, Message -AutoSize -Wrap
          if (@($findings).Count -gt 0) { throw "PSScriptAnalyzer reported $(@($findings).Count) finding(s)." }

      - name: Run Test Suite (PowerShell 7)
        shell: pwsh
        run: |
          ./_TESTS/run-tests.ps1 *>&1 | Tee-Object -FilePath ./test-results-ps7.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Test Suite (Windows PowerShell 5.1)
        shell: powershell
        run: |
          ./_TESTS/run-tests.ps1 *>&1 | Tee-Object -FilePath ./test-results-ps51.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Playground Automation (PowerShell 7)
        shell: pwsh
        run: |
          ./Playground/verify-playground.ps1

      - name: Verify Playground Automation (Windows PowerShell 5.1)
        shell: powershell
        run: |
          ./Playground/verify-playground.ps1

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs
          path: test-results-*.log
          if-no-files-found: ignore
